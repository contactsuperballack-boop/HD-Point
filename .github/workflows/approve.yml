name: Approve posts
# One-tap publishing from the GitHub mobile app: Actions > Approve posts > Run workflow.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Post slug(s), comma-separated, or all-passing for every draft that passed QA'
        required: true
      force:
        description: 'Approve even if QA failed (you checked it by hand)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: blog-run            # same group as the generator, so the two never push at once
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Approve
        env:
          SLUGS: ${{ inputs.slugs }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node engine/approve.js "$SLUGS" $FORCE
      - name: Commit
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A src/content review-queue.json
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Approve posts: ${{ inputs.slugs }}"
          git push
