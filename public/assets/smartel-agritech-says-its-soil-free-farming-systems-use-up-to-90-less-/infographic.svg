<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1478" role="img" aria-label="Infographic: Smartel Agritech says its soil-free farming systems use up to 90% less water" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1478" fill="#F7F8FA"/><rect width="1080" height="326" fill="#1B2A6B"/><text x="64" y="70" font-size="26" fill="#F2B134">Startup feature, Africa</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Smartel Agritech says its</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">soil-free farming systems</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">use up to 90% less water</text><text x="64" y="466" font-size="130" font-weight="800" fill="#1B2A6B">90</text><text x="64" y="516" font-size="32" fill="#505A7A">percent: Less water than traditional farming</text><rect x="65.5" y="555.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="576" font-size="28" fill="#14213D">Smartel Agritech says it uses hydroponics, which</text><text x="112" y="614" font-size="28" fill="#14213D">deliver nutrients directly through water, so that</text><text x="112" y="652" font-size="28" fill="#14213D">crops can be grown without soil.</text><text x="1016" y="576" font-size="20" fill="#505A7A" text-anchor="end">c1</text><rect x="65.5" y="687.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="708" font-size="28" fill="#14213D">The company says its systems use up to 90% less</text><text x="112" y="746" font-size="28" fill="#14213D">water than traditional farming.</text><text x="1016" y="708" font-size="20" fill="#505A7A" text-anchor="end">c2</text><rect x="65.5" y="781.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="802" font-size="28" fill="#14213D">Smartel says its focus is helping vulnerable</text><text x="112" y="840" font-size="28" fill="#14213D">communities in climate-arid regions grow food more</text><text x="112" y="878" font-size="28" fill="#14213D">sustainably.</text><text x="1016" y="802" font-size="20" fill="#505A7A" text-anchor="end">c3</text><rect x="65.5" y="913.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="934" font-size="28" fill="#14213D">The company says it offers farmers a 70/30</text><text x="112" y="972" font-size="28" fill="#14213D">revenue-sharing model.</text><text x="1016" y="934" font-size="20" fill="#505A7A" text-anchor="end">c4</text><rect x="65.5" y="1007.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1028" font-size="28" fill="#14213D">Smartel says its work aligns with the UN</text><text x="112" y="1066" font-size="28" fill="#14213D">Sustainable Development Goals, including food</text><text x="112" y="1104" font-size="28" fill="#14213D">security, water conservation and climate</text><text x="112" y="1142" font-size="28" fill="#14213D">resilience.</text><text x="1016" y="1028" font-size="20" fill="#505A7A" text-anchor="end">c5</text><rect x="65.5" y="1177.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1198" font-size="28" fill="#14213D">The site displays logos of six partners and</text><text x="112" y="1236" font-size="28" fill="#14213D">supporters, including the Diana Award and Mills</text><text x="112" y="1274" font-size="28" fill="#14213D">Fabrica.</text><text x="1016" y="1198" font-size="20" fill="#505A7A" text-anchor="end">c6</text><line x1="64" y1="1350" x2="1016" y2="1350" stroke="#C9CDE0" stroke-width="2"/><rect x="64" y="1374" width="22" height="22" fill="#1B2A6B"/><text x="98" y="1394" font-size="22" fill="#14213D">Verified</text><rect x="255.5" y="1375.5" width="19" height="19" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="290" y="1394" font-size="22" fill="#14213D">Company says</text><text x="958" y="1394" font-size="26" font-weight="800" fill="#1B2A6B" text-anchor="end">HD Point</text><g transform="translate(968 1360) scale(0.38)"><g fill="none" stroke="#1B2A6B" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#F2B134"/></g><text x="64" y="1438" font-size="20" fill="#505A7A">AI-assisted. Every claim is linked to a source in the full post.</text></svg>