<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1592" role="img" aria-label="Infographic: Talent Nation raises pre-seed round to train one million African AI engineers" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1592" fill="#0D1017"/><rect width="1080" height="326" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Funding, Nigeria</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Talent Nation raises</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">pre-seed round to train one</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">million African AI engineers</text><text x="64" y="466" font-size="130" font-weight="800" fill="#DDE3EF">63,000</text><text x="64" y="516" font-size="32" fill="#A5AEC0">applications: Learn2Earn applications</text><rect x="64" y="554" width="26" height="26" fill="#DDE3EF"/><text x="112" y="576" font-size="28" fill="#E8ECF4">Talent Nation, a startup founded by Nigerian</text><text x="112" y="614" font-size="28" fill="#E8ECF4">serial entrepreneur Iyinoluwa Aboyeji and South</text><text x="112" y="652" font-size="28" fill="#E8ECF4">African-born entrepreneur Kesiah Valkin, has</text><text x="112" y="690" font-size="28" fill="#E8ECF4">raised an undisclosed pre-seed round.</text><text x="1016" y="576" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="64" y="724" width="26" height="26" fill="#DDE3EF"/><text x="112" y="746" font-size="28" fill="#E8ECF4">It aims to train and deploy one million AI</text><text x="112" y="784" font-size="28" fill="#E8ECF4">engineers from Africa into businesses worldwide</text><text x="112" y="822" font-size="28" fill="#E8ECF4">over the next decade.</text><text x="1016" y="746" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="64" y="856" width="26" height="26" fill="#DDE3EF"/><text x="112" y="878" font-size="28" fill="#E8ECF4">The round was co-led by Enza Capital and</text><text x="112" y="916" font-size="28" fill="#E8ECF4">London-based LocalGlobe, with participation from</text><text x="112" y="954" font-size="28" fill="#E8ECF4">Future Africa, Kaleo Ventures, Ajim Capital,</text><text x="112" y="992" font-size="28" fill="#E8ECF4">Solving.org and Accelerate Africa.</text><text x="1016" y="878" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="64" y="1026" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1048" font-size="28" fill="#E8ECF4">Through its Learn2Earn academy, Talent Nation</text><text x="112" y="1086" font-size="28" fill="#E8ECF4">trains, certifies and deploys engineers into</text><text x="112" y="1124" font-size="28" fill="#E8ECF4">organisations that want to build and manage their</text><text x="112" y="1162" font-size="28" fill="#E8ECF4">own AI capabilities.</text><text x="1016" y="1048" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="64" y="1196" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1218" font-size="28" fill="#E8ECF4">Aboyeji, the executive chairman, co-founded Andela</text><text x="112" y="1256" font-size="28" fill="#E8ECF4">and Flutterwave, according to Semafor.</text><text x="1016" y="1218" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="64" y="1290" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1312" font-size="28" fill="#E8ECF4">The company has not disclosed the size of the</text><text x="112" y="1350" font-size="28" fill="#E8ECF4">round or a detailed timetable for reaching its</text><text x="112" y="1388" font-size="28" fill="#E8ECF4">target.</text><text x="1016" y="1312" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><line x1="64" y1="1464" x2="1016" y2="1464" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1488" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1508" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1489.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1508" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1508" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1474) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1552" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>