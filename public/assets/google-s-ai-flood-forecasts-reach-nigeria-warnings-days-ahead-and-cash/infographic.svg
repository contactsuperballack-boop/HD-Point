<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1654" role="img" aria-label="Infographic: Google's AI flood forecasts reach Nigeria: warnings days ahead and cash before the water rises" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1654" fill="#0D1017"/><rect width="1080" height="388" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Product launch, Nigeria</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Google's AI flood forecasts</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">reach Nigeria: warnings days</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">ahead and cash before the</text><text x="64" y="338" font-size="52" font-weight="800" fill="#fff">water rises</text><text x="64" y="528" font-size="130" font-weight="800" fill="#DDE3EF">24</text><text x="64" y="578" font-size="32" fill="#A5AEC0">hours: Flash-flood warning time</text><rect x="65.5" y="617.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="638" font-size="28" fill="#E8ECF4">Google says its AI predicts river floods up to</text><text x="112" y="676" font-size="28" fill="#E8ECF4">seven days before they strike and urban flash</text><text x="112" y="714" font-size="28" fill="#E8ECF4">floods up to 24 hours before they hit.</text><text x="1016" y="638" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="65.5" y="749.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="770" font-size="28" fill="#E8ECF4">Google says its flood forecasting now covers areas</text><text x="112" y="808" font-size="28" fill="#E8ECF4">across 150 countries where more than 2 billion</text><text x="112" y="846" font-size="28" fill="#E8ECF4">people live.</text><text x="1016" y="770" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="65.5" y="881.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="902" font-size="28" fill="#E8ECF4">The forecasts are available through Flood Hub and</text><text x="112" y="940" font-size="28" fill="#E8ECF4">also appear in Google Search when people look for</text><text x="112" y="978" font-size="28" fill="#E8ECF4">information on a flood in their area.</text><text x="1016" y="902" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="65.5" y="1013.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1034" font-size="28" fill="#E8ECF4">For urban flash floods, Google built a method</text><text x="112" y="1072" font-size="28" fill="#E8ECF4">called Groundsource, which uses its Gemini AI to</text><text x="112" y="1110" font-size="28" fill="#E8ECF4">analyse historical news reports.</text><text x="1016" y="1034" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="65.5" y="1145.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1166" font-size="28" fill="#E8ECF4">Google says Groundsource reviewed more than 5</text><text x="112" y="1204" font-size="28" fill="#E8ECF4">million reports spanning roughly 20 years and</text><text x="112" y="1242" font-size="28" fill="#E8ECF4">helped create a dataset of about 2.6 million flood</text><text x="112" y="1280" font-size="28" fill="#E8ECF4">events.</text><text x="1016" y="1166" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="65.5" y="1315.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1336" font-size="28" fill="#E8ECF4">In Kogi, Nigeria, one of West Africa's most</text><text x="112" y="1374" font-size="28" fill="#E8ECF4">flood-affected regions, GiveDirectly used Google's</text><text x="112" y="1412" font-size="28" fill="#E8ECF4">Flood Forecasting API to deliver cash to people</text><text x="112" y="1450" font-size="28" fill="#E8ECF4">before the water rose.</text><text x="1016" y="1336" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><line x1="64" y1="1526" x2="1016" y2="1526" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1550" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1570" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1551.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1570" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1570" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1536) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1614" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>