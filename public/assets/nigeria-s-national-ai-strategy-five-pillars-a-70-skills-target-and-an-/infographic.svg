<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1768" role="img" aria-label="Infographic: Nigeria's National AI Strategy: five pillars, a 70% skills target and an execution gap" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1768" fill="#0D1017"/><rect width="1080" height="388" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Landscape, Nigeria</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Nigeria's National AI</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">Strategy: five pillars, a</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">70% skills target and an</text><text x="64" y="338" font-size="52" font-weight="800" fill="#fff">execution gap</text><text x="64" y="528" font-size="130" font-weight="800" fill="#DDE3EF">70</text><text x="64" y="578" font-size="32" fill="#A5AEC0">percent: Youth AI-skills target</text><rect x="64" y="616" width="26" height="26" fill="#DDE3EF"/><text x="112" y="638" font-size="28" fill="#E8ECF4">Nigeria launched its National Artificial</text><text x="112" y="676" font-size="28" fill="#E8ECF4">Intelligence Strategy in Lagos in April 2025,</text><text x="112" y="714" font-size="28" fill="#E8ECF4">according to Nairametrics.</text><text x="1016" y="638" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="64" y="748" width="26" height="26" fill="#DDE3EF"/><text x="112" y="770" font-size="28" fill="#E8ECF4">The strategy is built on five pillars: building AI</text><text x="112" y="808" font-size="28" fill="#E8ECF4">infrastructure, fostering an innovation ecosystem,</text><text x="112" y="846" font-size="28" fill="#E8ECF4">driving AI adoption across sectors, ensuring</text><text x="112" y="884" font-size="28" fill="#E8ECF4">responsible AI development, and…</text><text x="1016" y="770" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="65.5" y="919.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="940" font-size="28" fill="#E8ECF4">A four-day workshop in Abuja brought together over</text><text x="112" y="978" font-size="28" fill="#E8ECF4">120 AI researchers and practitioners to draft the</text><text x="112" y="1016" font-size="28" fill="#E8ECF4">strategy, according to the Ministry of</text><text x="112" y="1054" font-size="28" fill="#E8ECF4">Communications, Innovation and Digital Economy.</text><text x="1016" y="940" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="64" y="1088" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1110" font-size="28" fill="#E8ECF4">A draft of the strategy was published in August</text><text x="112" y="1148" font-size="28" fill="#E8ECF4">2024.</text><text x="1016" y="1110" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="64" y="1182" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1204" font-size="28" fill="#E8ECF4">The strategy cites a target to equip 70% of youth</text><text x="112" y="1242" font-size="28" fill="#E8ECF4">with AI-related skills.</text><text x="1016" y="1204" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="64" y="1276" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1298" font-size="28" fill="#E8ECF4">Short-term items include setting up governance</text><text x="112" y="1336" font-size="28" fill="#E8ECF4">bodies, seeding demonstration projects, a national</text><text x="112" y="1374" font-size="28" fill="#E8ECF4">AI skills drive and pilot high-performance</text><text x="112" y="1412" font-size="28" fill="#E8ECF4">computing infrastructure.</text><text x="1016" y="1298" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><text x="64" y="1478" font-size="30" font-weight="700" fill="#DDE3EF">Figures (percent of GDP)</text><text x="64" y="1536" font-size="22" fill="#E8ECF4">Nigeria</text><rect x="374" y="1508" width="44" height="38" fill="#DDE3EF"/><text x="430" y="1536" font-size="22" fill="#E8ECF4">0.2</text><text x="64" y="1592" font-size="22" fill="#E8ECF4">Global average</text><rect x="374" y="1564" width="480" height="38" fill="#DDE3EF"/><text x="866" y="1592" font-size="22" fill="#E8ECF4">2.2</text><line x1="64" y1="1640" x2="1016" y2="1640" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1664" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1684" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1665.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1684" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1684" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1650) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1728" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>