<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1554" role="img" aria-label="Infographic: Abuja City Walk sets out a five-pillar plan for a mixed-use urban district" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1554" fill="#F7F8FA"/><rect width="1080" height="326" fill="#1B2A6B"/><text x="64" y="70" font-size="26" fill="#F2B134">Local news, Nigeria</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Abuja City Walk sets out a</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">five-pillar plan for a</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">mixed-use urban district</text><text x="64" y="466" font-size="130" font-weight="800" fill="#1B2A6B">5</text><text x="64" y="516" font-size="32" fill="#505A7A">pillars: Pillars listed</text><rect x="65.5" y="555.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="576" font-size="28" fill="#14213D">Abuja City Walk says its vision is to create</text><text x="112" y="614" font-size="28" fill="#14213D">Africa's most dynamic urban district, blending</text><text x="112" y="652" font-size="28" fill="#14213D">world-class infrastructure with cultural</text><text x="112" y="690" font-size="28" fill="#14213D">authenticity and sustainable living.</text><text x="1016" y="576" font-size="20" fill="#505A7A" text-anchor="end">c1</text><rect x="65.5" y="725.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="746" font-size="28" fill="#14213D">The project describes itself as an integrated</text><text x="112" y="784" font-size="28" fill="#14213D">lifestyle destination in Abuja, planned to foster</text><text x="112" y="822" font-size="28" fill="#14213D">economic growth, cultural exchange and community</text><text x="112" y="860" font-size="28" fill="#14213D">well-being.</text><text x="1016" y="746" font-size="20" fill="#505A7A" text-anchor="end">c2</text><rect x="65.5" y="895.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="916" font-size="28" fill="#14213D">It lists five pillars: Business, Lifestyle,</text><text x="112" y="954" font-size="28" fill="#14213D">Innovation, Culture and Community.</text><text x="1016" y="916" font-size="20" fill="#505A7A" text-anchor="end">c3</text><rect x="65.5" y="989.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1010" font-size="28" fill="#14213D">Under Innovation, the project says it is driving</text><text x="112" y="1048" font-size="28" fill="#14213D">technological advancement and smart city solutions</text><text x="112" y="1086" font-size="28" fill="#14213D">for sustainable urban development.</text><text x="1016" y="1010" font-size="20" fill="#505A7A" text-anchor="end">c4</text><rect x="65.5" y="1121.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1142" font-size="28" fill="#14213D">The website lists project pages for a masterplan,</text><text x="112" y="1180" font-size="28" fill="#14213D">residences, an experience centre and a free zone.</text><text x="1016" y="1142" font-size="20" fill="#505A7A" text-anchor="end">c5</text><rect x="65.5" y="1215.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1236" font-size="28" fill="#14213D">The site says property purchase inquiries should</text><text x="112" y="1274" font-size="28" fill="#14213D">go only to its official email channel, and that</text><text x="112" y="1312" font-size="28" fill="#14213D">the management of Links International is not</text><text x="112" y="1350" font-size="28" fill="#14213D">responsible for dealings with…</text><text x="1016" y="1236" font-size="20" fill="#505A7A" text-anchor="end">c6</text><line x1="64" y1="1426" x2="1016" y2="1426" stroke="#C9CDE0" stroke-width="2"/><rect x="64" y="1450" width="22" height="22" fill="#1B2A6B"/><text x="98" y="1470" font-size="22" fill="#14213D">Verified</text><rect x="255.5" y="1451.5" width="19" height="19" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="290" y="1470" font-size="22" fill="#14213D">Company says</text><text x="958" y="1470" font-size="26" font-weight="800" fill="#1B2A6B" text-anchor="end">HD Point</text><g transform="translate(968 1436) scale(0.38)"><g fill="none" stroke="#1B2A6B" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#F2B134"/></g><text x="64" y="1514" font-size="20" fill="#505A7A">AI-assisted. Every claim is linked to a source in the full post.</text></svg>