<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1502" role="img" aria-label="Infographic: Ignite sets out six on-demand AI services, delivered remotely from Africa" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1502" fill="#F7F8FA"/><rect width="1080" height="388" fill="#1B2A6B"/><text x="64" y="70" font-size="26" fill="#F2B134">Startup feature, Africa</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Ignite sets out six</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">on-demand AI services,</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">delivered remotely from</text><text x="64" y="338" font-size="52" font-weight="800" fill="#fff">Africa</text><text x="64" y="528" font-size="130" font-weight="800" fill="#1B2A6B">6</text><text x="64" y="578" font-size="32" fill="#505A7A">services: Services offered</text><rect x="65.5" y="617.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="638" font-size="28" fill="#14213D">Ignite describes itself as an SI-native company</text><text x="112" y="676" font-size="28" fill="#14213D">that provides products, data, experts, evaluation,</text><text x="112" y="714" font-size="28" fill="#14213D">benchmarks and intelligence as a service.</text><text x="1016" y="638" font-size="20" fill="#505A7A" text-anchor="end">c1</text><rect x="65.5" y="749.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="770" font-size="28" fill="#14213D">The company says it delivers this work through</text><text x="112" y="808" font-size="28" fill="#14213D">three arms: iBuild, iStudios and Ignite Academy.</text><text x="1016" y="770" font-size="20" fill="#505A7A" text-anchor="end">c2</text><rect x="65.5" y="843.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="864" font-size="28" fill="#14213D">Ignite lists six services, each offered as a</text><text x="112" y="902" font-size="28" fill="#14213D">service: SI products, data, experts, evaluation,</text><text x="112" y="940" font-size="28" fill="#14213D">benchmark and intelligence.</text><text x="1016" y="864" font-size="20" fill="#505A7A" text-anchor="end">c3</text><rect x="65.5" y="975.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="996" font-size="28" fill="#14213D">It says it works remotely from Africa so that</text><text x="112" y="1034" font-size="28" fill="#14213D">teams anywhere can work with it.</text><text x="1016" y="996" font-size="20" fill="#505A7A" text-anchor="end">c4</text><rect x="65.5" y="1069.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1090" font-size="28" fill="#14213D">Ignite says it is part of Trustbridge Corp, which</text><text x="112" y="1128" font-size="28" fill="#14213D">provides its ownership, governance and long-term</text><text x="112" y="1166" font-size="28" fill="#14213D">direction.</text><text x="1016" y="1090" font-size="20" fill="#505A7A" text-anchor="end">c5</text><rect x="65.5" y="1201.5" width="23" height="23" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="112" y="1222" font-size="28" fill="#14213D">The company says Ignite Academy develops SI-native</text><text x="112" y="1260" font-size="28" fill="#14213D">experts, with capstone projects and portfolios as</text><text x="112" y="1298" font-size="28" fill="#14213D">part of the programme.</text><text x="1016" y="1222" font-size="20" fill="#505A7A" text-anchor="end">c6</text><line x1="64" y1="1374" x2="1016" y2="1374" stroke="#C9CDE0" stroke-width="2"/><rect x="64" y="1398" width="22" height="22" fill="#1B2A6B"/><text x="98" y="1418" font-size="22" fill="#14213D">Verified</text><rect x="255.5" y="1399.5" width="19" height="19" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="290" y="1418" font-size="22" fill="#14213D">Company says</text><text x="958" y="1418" font-size="26" font-weight="800" fill="#1B2A6B" text-anchor="end">HD Point</text><g transform="translate(968 1384) scale(0.38)"><g fill="none" stroke="#1B2A6B" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#F2B134"/></g><text x="64" y="1462" font-size="20" fill="#505A7A">AI-assisted. Every claim is linked to a source in the full post.</text></svg>