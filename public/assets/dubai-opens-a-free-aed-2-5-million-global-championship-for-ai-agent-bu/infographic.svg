<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1668" role="img" aria-label="Infographic: Dubai opens a free, AED 2.5 million global championship for AI-agent builders" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1668" fill="#0D1017"/><rect width="1080" height="326" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Product launch, UAE</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Dubai opens a free, AED 2.5</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">million global championship</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">for AI-agent builders</text><text x="64" y="466" font-size="130" font-weight="800" fill="#DDE3EF">2.5</text><text x="64" y="516" font-size="32" fill="#A5AEC0">million AED: Prize pool</text><rect x="65.5" y="555.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="576" font-size="28" fill="#E8ECF4">Dubai has launched the Create AI Agents</text><text x="112" y="614" font-size="28" fill="#E8ECF4">Championship, a global competition for practical</text><text x="112" y="652" font-size="28" fill="#E8ECF4">and scalable AI-agent solutions to real-world</text><text x="112" y="690" font-size="28" fill="#E8ECF4">challenges, with a total prize pool of more…</text><text x="1016" y="576" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="64" y="724" width="26" height="26" fill="#DDE3EF"/><text x="112" y="746" font-size="28" fill="#E8ECF4">Sheikh Hamdan bin Mohammed bin Rashid Al Maktoum,</text><text x="112" y="784" font-size="28" fill="#E8ECF4">Crown Prince of Dubai, announced the launch and</text><text x="112" y="822" font-size="28" fill="#E8ECF4">invited innovators from across the world.</text><text x="1016" y="746" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="65.5" y="857.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="878" font-size="28" fill="#E8ECF4">The organiser says the championship shifts the</text><text x="112" y="916" font-size="28" fill="#E8ECF4">focus from developing digital applications to</text><text x="112" y="954" font-size="28" fill="#E8ECF4">creating autonomous AI-agent systems built for</text><text x="112" y="992" font-size="28" fill="#E8ECF4">real user needs and market requirements.</text><text x="1016" y="878" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="64" y="1026" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1048" font-size="28" fill="#E8ECF4">The championship is part of the Create Apps in</text><text x="112" y="1086" font-size="28" fill="#E8ECF4">Dubai initiative, led by the Dubai Chamber of</text><text x="112" y="1124" font-size="28" fill="#E8ECF4">Digital Economy to support app development,</text><text x="112" y="1162" font-size="28" fill="#E8ECF4">digital skills and technology entrepreneurship.</text><text x="1016" y="1048" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="65.5" y="1197.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1218" font-size="28" fill="#E8ECF4">It has four core categories: Best Societal AI</text><text x="112" y="1256" font-size="28" fill="#E8ECF4">Agent, Best Personal AI Agent, Best Business AI</text><text x="112" y="1294" font-size="28" fill="#E8ECF4">Agent and Best Youth AI Agent.</text><text x="1016" y="1218" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="65.5" y="1329.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1350" font-size="28" fill="#E8ECF4">The Best Societal category recognises agents that</text><text x="112" y="1388" font-size="28" fill="#E8ECF4">strengthen social cohesion and inclusion and</text><text x="112" y="1426" font-size="28" fill="#E8ECF4">support education, sustainability and social</text><text x="112" y="1464" font-size="28" fill="#E8ECF4">resilience.</text><text x="1016" y="1350" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><line x1="64" y1="1540" x2="1016" y2="1540" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1564" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1584" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1565.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1584" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1584" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1550) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1628" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>