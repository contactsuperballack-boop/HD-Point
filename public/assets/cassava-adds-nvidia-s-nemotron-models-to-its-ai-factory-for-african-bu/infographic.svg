<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1806" role="img" aria-label="Infographic: Cassava adds Nvidia's Nemotron models to its AI Factory for African businesses" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1806" fill="#0D1017"/><rect width="1080" height="388" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Product launch, Africa</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Cassava adds Nvidia's</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">Nemotron models to its AI</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">Factory for African</text><text x="64" y="338" font-size="52" font-weight="800" fill="#fff">businesses</text><text x="64" y="528" font-size="130" font-weight="800" fill="#DDE3EF">720</text><text x="64" y="578" font-size="32" fill="#A5AEC0">million dollars: Reported investment</text><rect x="64" y="616" width="26" height="26" fill="#DDE3EF"/><text x="112" y="638" font-size="28" fill="#E8ECF4">Cassava Technologies has announced that it will</text><text x="112" y="676" font-size="28" fill="#E8ECF4">offer Nvidia's Nemotron open models as a managed</text><text x="112" y="714" font-size="28" fill="#E8ECF4">service on its AI Factory, its Nvidia-powered</text><text x="112" y="752" font-size="28" fill="#E8ECF4">computing platform.</text><text x="1016" y="638" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="64" y="786" width="26" height="26" fill="#DDE3EF"/><text x="112" y="808" font-size="28" fill="#E8ECF4">The service gives African businesses API access to</text><text x="112" y="846" font-size="28" fill="#E8ECF4">AI tools and managed computing.</text><text x="1016" y="808" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="64" y="880" width="26" height="26" fill="#DDE3EF"/><text x="112" y="902" font-size="28" fill="#E8ECF4">Cassava is also using Nvidia OpenShell to combine</text><text x="112" y="940" font-size="28" fill="#E8ECF4">computing, controlled agent activity and</text><text x="112" y="978" font-size="28" fill="#E8ECF4">independent security enforcement, as AI agents</text><text x="112" y="1016" font-size="28" fill="#E8ECF4">gain access to business systems.</text><text x="1016" y="902" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="65.5" y="1051.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1072" font-size="28" fill="#E8ECF4">Cassava's Group Chief Technology and AI Officer,</text><text x="112" y="1110" font-size="28" fill="#E8ECF4">Ahmed El Beheiry, said expanding the AI Factory</text><text x="112" y="1148" font-size="28" fill="#E8ECF4">across its markets is about creating the capacity</text><text x="112" y="1186" font-size="28" fill="#E8ECF4">and economics businesses need to build and…</text><text x="1016" y="1072" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="64" y="1220" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1242" font-size="28" fill="#E8ECF4">Cassava first announced its AI Factory in March</text><text x="112" y="1280" font-size="28" fill="#E8ECF4">2025, with data centres in South Africa, Egypt,</text><text x="112" y="1318" font-size="28" fill="#E8ECF4">Kenya, Morocco and Nigeria in line for upgrades</text><text x="112" y="1356" font-size="28" fill="#E8ECF4">with Nvidia hardware, and said the aim was to…</text><text x="1016" y="1242" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="64" y="1390" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1412" font-size="28" fill="#E8ECF4">Bloomberg reported that Cassava could invest up to</text><text x="112" y="1450" font-size="28" fill="#E8ECF4">$720 million in the AI factory.</text><text x="1016" y="1412" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><text x="64" y="1516" font-size="30" font-weight="700" fill="#DDE3EF">Figures (GPUs)</text><text x="64" y="1574" font-size="22" fill="#E8ECF4">First South Africa deploy…</text><rect x="374" y="1546" width="120" height="38" fill="#DDE3EF"/><text x="506" y="1574" font-size="22" fill="#E8ECF4">3,000</text><text x="64" y="1630" font-size="22" fill="#E8ECF4">GPUs acquired</text><rect x="374" y="1602" width="480" height="38" fill="#DDE3EF"/><text x="866" y="1630" font-size="22" fill="#E8ECF4">12,000</text><line x1="64" y1="1678" x2="1016" y2="1678" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1702" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1722" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1703.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1722" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1722" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1688) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1766" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>