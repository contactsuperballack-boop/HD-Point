<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1706" role="img" aria-label="Infographic: AI on African farms: advice by SMS, satellites overhead and a low-adoption warning" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1706" fill="#0D1017"/><rect width="1080" height="326" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Landscape, Africa</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">AI on African farms: advice</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">by SMS, satellites overhead</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">and a low-adoption warning</text><text x="64" y="466" font-size="130" font-weight="800" fill="#DDE3EF">1.2</text><text x="64" y="516" font-size="32" fill="#A5AEC0">million farmers: iShamba farmers</text><rect x="64" y="554" width="26" height="26" fill="#DDE3EF"/><text x="112" y="576" font-size="28" fill="#E8ECF4">A 2026 systematic review of AI in East African</text><text x="112" y="614" font-size="28" fill="#E8ECF4">agriculture identifies five main application</text><text x="112" y="652" font-size="28" fill="#E8ECF4">areas: advisory services, precision agriculture,</text><text x="112" y="690" font-size="28" fill="#E8ECF4">crop and pest monitoring, financial and…</text><text x="1016" y="576" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="64" y="724" width="26" height="26" fill="#DDE3EF"/><text x="112" y="746" font-size="28" fill="#E8ECF4">The review finds that adoption of AI among</text><text x="112" y="784" font-size="28" fill="#E8ECF4">smallholder farmers in East Africa remains</text><text x="112" y="822" font-size="28" fill="#E8ECF4">relatively low and uneven.</text><text x="1016" y="746" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="64" y="856" width="26" height="26" fill="#DDE3EF"/><text x="112" y="878" font-size="28" fill="#E8ECF4">It reports that in parts of East Africa, farmers</text><text x="112" y="916" font-size="28" fill="#E8ECF4">using digital and AI-supported advisory services</text><text x="112" y="954" font-size="28" fill="#E8ECF4">reported better crop management, increased yields</text><text x="112" y="992" font-size="28" fill="#E8ECF4">and reduced input waste.</text><text x="1016" y="878" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="64" y="1026" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1048" font-size="28" fill="#E8ECF4">Kenya leads in AI use among smallholder farmers,</text><text x="112" y="1086" font-size="28" fill="#E8ECF4">while Ethiopia shows the lowest adoption, which</text><text x="112" y="1124" font-size="28" fill="#E8ECF4">the review links to access to smartphones and</text><text x="112" y="1162" font-size="28" fill="#E8ECF4">digital agricultural services.</text><text x="1016" y="1048" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="64" y="1196" width="26" height="26" fill="#DDE3EF"/><text x="112" y="1218" font-size="28" fill="#E8ECF4">Kenyan smallholders use tools including</text><text x="112" y="1256" font-size="28" fill="#E8ECF4">PlantVillage+ and Virtual Agronomist to get</text><text x="112" y="1294" font-size="28" fill="#E8ECF4">real-time advice on pest control, fertiliser use</text><text x="112" y="1332" font-size="28" fill="#E8ECF4">and crop disease detection.</text><text x="1016" y="1218" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="65.5" y="1367.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1388" font-size="28" fill="#E8ECF4">A data scientist quoted by iAfrica says mobile</text><text x="112" y="1426" font-size="28" fill="#E8ECF4">tools such as WhatsApp bots could give</text><text x="112" y="1464" font-size="28" fill="#E8ECF4">smallholders real-time agronomic advice and</text><text x="112" y="1502" font-size="28" fill="#E8ECF4">address a shortage of agricultural…</text><text x="1016" y="1388" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><line x1="64" y1="1578" x2="1016" y2="1578" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1602" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1622" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1603.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1622" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1622" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1588) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1666" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>