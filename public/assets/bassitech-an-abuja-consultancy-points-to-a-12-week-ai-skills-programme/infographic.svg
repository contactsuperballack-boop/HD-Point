<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1388" role="img" aria-label="Infographic: BassiTech, an Abuja consultancy, points to a 12-week AI skills programme for 100 young people" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1388" fill="#0D1017"/><rect width="1080" height="388" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Startup feature, Nigeria</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">BassiTech, an Abuja</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">consultancy, points to a</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">12-week AI skills programme</text><text x="64" y="338" font-size="52" font-weight="800" fill="#fff">for 100 young people</text><text x="64" y="528" font-size="130" font-weight="800" fill="#DDE3EF">100</text><text x="64" y="578" font-size="32" fill="#A5AEC0">young people: Programme participants</text><rect x="65.5" y="617.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="638" font-size="28" fill="#E8ECF4">BassiTech Solutions describes itself as an</text><text x="112" y="676" font-size="28" fill="#E8ECF4">Abuja-based technology consulting company offering</text><text x="112" y="714" font-size="28" fill="#E8ECF4">strategy, software, proposals and digital skills.</text><text x="1016" y="638" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="65.5" y="749.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="770" font-size="28" fill="#E8ECF4">The company says it serves businesses and</text><text x="112" y="808" font-size="28" fill="#E8ECF4">organisations in fintech, telecoms, agriculture</text><text x="112" y="846" font-size="28" fill="#E8ECF4">and media.</text><text x="1016" y="770" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="65.5" y="881.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="902" font-size="28" fill="#E8ECF4">BassiTech says its Digital Wings Initiative is an</text><text x="112" y="940" font-size="28" fill="#E8ECF4">AI-focused digital skills programme in Taraba</text><text x="112" y="978" font-size="28" fill="#E8ECF4">State.</text><text x="1016" y="902" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="65.5" y="1013.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1034" font-size="28" fill="#E8ECF4">The programme is designed for 100 young people.</text><text x="1016" y="1034" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="65.5" y="1069.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1090" font-size="28" fill="#E8ECF4">The programme runs for 12 weeks.</text><text x="1016" y="1090" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="65.5" y="1125.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1146" font-size="28" fill="#E8ECF4">The company says it has designed 2 farming</text><text x="112" y="1184" font-size="28" fill="#E8ECF4">programmes for Kudan LGA.</text><text x="1016" y="1146" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><line x1="64" y1="1260" x2="1016" y2="1260" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1284" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1304" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1285.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1304" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1304" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1270) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1348" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>