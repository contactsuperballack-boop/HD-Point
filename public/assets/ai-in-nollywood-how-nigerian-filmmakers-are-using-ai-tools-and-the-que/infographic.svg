<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1768" role="img" aria-label="Infographic: AI in Nollywood: how Nigerian filmmakers are using AI tools, and the questions they face" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1768" fill="#0D1017"/><rect width="1080" height="388" fill="#1B2230"/><text x="64" y="70" font-size="26" fill="#A5AEC0">Landscape, Nigeria</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">AI in Nollywood: how</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">Nigerian filmmakers are</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">using AI tools, and the</text><text x="64" y="338" font-size="52" font-weight="800" fill="#fff">questions they face</text><text x="64" y="528" font-size="130" font-weight="800" fill="#DDE3EF">490</text><text x="64" y="578" font-size="32" fill="#A5AEC0">submissions: Festival debut submissions</text><rect x="64" y="616" width="26" height="26" fill="#DDE3EF"/><text x="112" y="638" font-size="28" fill="#E8ECF4">Nigerian filmmakers and digital creators are using</text><text x="112" y="676" font-size="28" fill="#E8ECF4">AI to cut costs, expand storytelling possibilities</text><text x="112" y="714" font-size="28" fill="#E8ECF4">and compete globally, industry insiders told</text><text x="112" y="752" font-size="28" fill="#E8ECF4">Forbes Africa.</text><text x="1016" y="638" font-size="20" fill="#A5AEC0" text-anchor="end">c1</text><rect x="64" y="786" width="26" height="26" fill="#DDE3EF"/><text x="112" y="808" font-size="28" fill="#E8ECF4">In March 2026, a YouTube-backed workshop in Lagos</text><text x="112" y="846" font-size="28" fill="#E8ECF4">introduced filmmakers including Biodun Stephen and</text><text x="112" y="884" font-size="28" fill="#E8ECF4">Omoni Oboli to Flow, an AI filmmaking tool</text><text x="112" y="922" font-size="28" fill="#E8ECF4">developed by Google.</text><text x="1016" y="808" font-size="20" fill="#A5AEC0" text-anchor="end">c2</text><rect x="65.5" y="957.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="978" font-size="28" fill="#E8ECF4">Filmmakers at the workshop said AI could help them</text><text x="112" y="1016" font-size="28" fill="#E8ECF4">visualise scenes before filming, speed up</text><text x="112" y="1054" font-size="28" fill="#E8ECF4">conceptualisation and simulate scenes that would</text><text x="112" y="1092" font-size="28" fill="#E8ECF4">be expensive or difficult to shoot.</text><text x="1016" y="978" font-size="20" fill="#A5AEC0" text-anchor="end">c3</text><rect x="65.5" y="1127.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1148" font-size="28" fill="#E8ECF4">Actor and producer Omoni Oboli says she has used</text><text x="112" y="1186" font-size="28" fill="#E8ECF4">AI tools to generate story ideas, animate videos</text><text x="112" y="1224" font-size="28" fill="#E8ECF4">and create promotional materials.</text><text x="1016" y="1148" font-size="20" fill="#A5AEC0" text-anchor="end">c4</text><rect x="65.5" y="1259.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1280" font-size="28" fill="#E8ECF4">Travel and lifestyle creator Tayo Aina says he has</text><text x="112" y="1318" font-size="28" fill="#E8ECF4">used generative AI to recreate historical moments</text><text x="112" y="1356" font-size="28" fill="#E8ECF4">in his documentary-style videos when archival</text><text x="112" y="1394" font-size="28" fill="#E8ECF4">footage was unavailable.</text><text x="1016" y="1280" font-size="20" fill="#A5AEC0" text-anchor="end">c5</text><rect x="65.5" y="1429.5" width="23" height="23" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="112" y="1450" font-size="28" fill="#E8ECF4">For the film Eshugbayi Eleko, AI was used to</text><text x="112" y="1488" font-size="28" fill="#E8ECF4">create establishing shots and briefly reconstruct</text><text x="112" y="1526" font-size="28" fill="#E8ECF4">Lagos as it looked in the late 19th and early 20th</text><text x="112" y="1564" font-size="28" fill="#E8ECF4">centuries, with some AI-generated…</text><text x="1016" y="1450" font-size="20" fill="#A5AEC0" text-anchor="end">c6</text><line x1="64" y1="1640" x2="1016" y2="1640" stroke="#2A3243" stroke-width="2"/><rect x="64" y="1664" width="22" height="22" fill="#DDE3EF"/><text x="98" y="1684" font-size="22" fill="#E8ECF4">Verified</text><rect x="255.5" y="1665.5" width="19" height="19" fill="none" stroke="#C7CFDD" stroke-width="3"/><text x="290" y="1684" font-size="22" fill="#E8ECF4">Company says</text><text x="958" y="1684" font-size="26" font-weight="800" fill="#DDE3EF" text-anchor="end">HD Point</text><g transform="translate(968 1650) scale(0.38)"><g fill="none" stroke="#DDE3EF" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#A5AEC0"/></g><text x="64" y="1728" font-size="20" fill="#A5AEC0">AI-assisted. Every claim is linked to a source in the full post.</text></svg>