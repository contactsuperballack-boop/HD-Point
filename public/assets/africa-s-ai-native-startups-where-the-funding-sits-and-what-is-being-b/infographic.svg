<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1704" role="img" aria-label="Infographic: Africa's AI-native startups: where the funding sits and what is being built" font-family="'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><rect width="1080" height="1704" fill="#F7F8FA"/><rect width="1080" height="326" fill="#1B2A6B"/><text x="64" y="70" font-size="26" fill="#F2B134">Landscape, Africa</text><text x="64" y="152" font-size="52" font-weight="800" fill="#fff">Africa's AI-native startups:</text><text x="64" y="214" font-size="52" font-weight="800" fill="#fff">where the funding sits and</text><text x="64" y="276" font-size="52" font-weight="800" fill="#fff">what is being built</text><text x="64" y="466" font-size="130" font-weight="800" fill="#1B2A6B">635</text><text x="64" y="516" font-size="32" fill="#505A7A">million dollars: Nigeria</text><rect x="64" y="554" width="26" height="26" fill="#1B2A6B"/><text x="112" y="576" font-size="28" fill="#14213D">Nigerian startups raised $635 million between</text><text x="112" y="614" font-size="28" fill="#14213D">January and September 2026, according to data from</text><text x="112" y="652" font-size="28" fill="#14213D">Africa: The Big Deal.</text><text x="1016" y="576" font-size="20" fill="#505A7A" text-anchor="end">c1</text><rect x="64" y="686" width="26" height="26" fill="#1B2A6B"/><text x="112" y="708" font-size="28" fill="#14213D">Egypt raised $445 million in the same period,</text><text x="112" y="746" font-size="28" fill="#14213D">according to Africa: The Big Deal.</text><text x="1016" y="708" font-size="20" fill="#505A7A" text-anchor="end">c2</text><rect x="64" y="780" width="26" height="26" fill="#1B2A6B"/><text x="112" y="802" font-size="28" fill="#14213D">Kenyan startups raised $201 million in the first</text><text x="112" y="840" font-size="28" fill="#14213D">nine months of 2026.</text><text x="1016" y="802" font-size="20" fill="#505A7A" text-anchor="end">c3</text><rect x="64" y="874" width="26" height="26" fill="#1B2A6B"/><text x="112" y="896" font-size="28" fill="#14213D">South Africa raised $182 million in the same</text><text x="112" y="934" font-size="28" fill="#14213D">period, the least of the four largest markets.</text><text x="1016" y="896" font-size="20" fill="#505A7A" text-anchor="end">c4</text><rect x="64" y="968" width="26" height="26" fill="#1B2A6B"/><text x="112" y="990" font-size="28" fill="#14213D">Nigeria, Egypt, Kenya and South Africa together</text><text x="112" y="1028" font-size="28" fill="#14213D">took 85% of all country-specific startup funding,</text><text x="112" y="1066" font-size="28" fill="#14213D">up from 83% in 2025.</text><text x="1016" y="990" font-size="20" fill="#505A7A" text-anchor="end">c5</text><rect x="64" y="1100" width="26" height="26" fill="#1B2A6B"/><text x="112" y="1122" font-size="28" fill="#14213D">In the first half of 2026, fintech was the largest</text><text x="112" y="1160" font-size="28" fill="#14213D">funded sector at 41% ($556 million), ahead of</text><text x="112" y="1198" font-size="28" fill="#14213D">logistics and transport at 35% ($472 million) and</text><text x="112" y="1236" font-size="28" fill="#14213D">agriculture and food at 7% ($93 million).</text><text x="1016" y="1122" font-size="20" fill="#505A7A" text-anchor="end">c6</text><text x="64" y="1302" font-size="30" font-weight="700" fill="#1B2A6B">Figures (million dollars)</text><text x="64" y="1360" font-size="22" fill="#14213D">Nigeria</text><rect x="374" y="1332" width="480" height="38" fill="#1B2A6B"/><text x="866" y="1360" font-size="22" fill="#14213D">635</text><text x="64" y="1416" font-size="22" fill="#14213D">Egypt</text><rect x="374" y="1388" width="336" height="38" fill="#1B2A6B"/><text x="722" y="1416" font-size="22" fill="#14213D">445</text><text x="64" y="1472" font-size="22" fill="#14213D">Kenya</text><rect x="374" y="1444" width="152" height="38" fill="#1B2A6B"/><text x="538" y="1472" font-size="22" fill="#14213D">201</text><text x="64" y="1528" font-size="22" fill="#14213D">South Africa</text><rect x="374" y="1500" width="138" height="38" fill="#1B2A6B"/><text x="524" y="1528" font-size="22" fill="#14213D">182</text><line x1="64" y1="1576" x2="1016" y2="1576" stroke="#C9CDE0" stroke-width="2"/><rect x="64" y="1600" width="22" height="22" fill="#1B2A6B"/><text x="98" y="1620" font-size="22" fill="#14213D">Verified</text><rect x="255.5" y="1601.5" width="19" height="19" fill="none" stroke="#8A5A00" stroke-width="3"/><text x="290" y="1620" font-size="22" fill="#14213D">Company says</text><text x="958" y="1620" font-size="26" font-weight="800" fill="#1B2A6B" text-anchor="end">HD Point</text><g transform="translate(968 1586) scale(0.38)"><g fill="none" stroke="#1B2A6B" stroke-width="14"><path d="M10 0V100"/><path d="M54 0V100"/><path d="M54 7H66A43 43 0 0 1 66 93H54"/><path d="M10 50H54"/></g><circle cx="32" cy="50" r="5.4" fill="#F2B134"/></g><text x="64" y="1664" font-size="20" fill="#505A7A">AI-assisted. Every claim is linked to a source in the full post.</text></svg>